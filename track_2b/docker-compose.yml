services:
  meditations:
    build: .
    image: meditations-apertus-rag
    ports:
      - "7860:7860"
    # The LLM endpoint (Hack Apertus convention): LLM_NAME, LLM_BASE_URL,
    # LLM_API_KEY, from the shell or from .env (see .env.example).
    environment:
      - LLM_NAME
      - LLM_BASE_URL
      - LLM_API_KEY
    env_file:
      - path: .env
        required: false
